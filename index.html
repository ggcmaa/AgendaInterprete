<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMAA - Agendamento de Intérpretes de Libras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0d1117;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .card-cmaa {
      background-color: #161b22;
      border: 1px solid #21262d;
      position: relative;
    }

    .card-cmaa::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #a3e635 0%, #4ade80 50%, #22c55e 100%);
      border-top-left-radius: 0.75rem;
      border-top-right-radius: 0.75rem;
    }

    .input-cmaa {
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #f0f6fc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-cmaa:focus {
      border-color: #4ade80;
      outline: none;
      box-shadow: 0 0 0 1px #4ade80;
    }

    .btn-cmaa {
      background-color: #74c676;
      color: #0d1117;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-cmaa:hover {
      background-color: #61b563;
    }

    .btn-cmaa:active {
      transform: scale(0.99);
    }

    .title-green {
      color: #8ce99a;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="card-cmaa rounded-xl shadow-2xl max-w-xl w-full p-8 overflow-hidden">
    
    <!-- LOGO CMAA -->
    <div class="flex flex-col items-center justify-center mb-6 pt-2">
      <img src="CMAA.png" alt="CMAA - Energia que transforma" class="h-20 w-auto object-contain mb-2" />
    </div>

    <!-- ABA 1: LOGIN -->
    <section id="tab-login" class="space-y-6">
      <form id="form-login" onsubmit="realizarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Nome de Usuário / Email</label>
          <input type="text" id="login-username" required placeholder="seu.usuario"
                 class="input-cmaa w-full px-4 py-2.5 rounded-lg text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Senha de Acesso (Numérica)</label>
          <input type="password" id="login-password" required inputmode="numeric" pattern="[0-9]*" placeholder="******"
                 class="input-cmaa w-full px-4 py-2.5 rounded-lg text-sm">
        </div>

        <div id="login-alerta" class="hidden text-xs p-3 rounded-lg border"></div>

        <button type="submit" id="btn-login"
                class="btn-cmaa w-full py-3 rounded-lg text-sm uppercase">
          Acessar Portal
        </button>
      </form>
    </section>

    <!-- ABA 2: FORMULÁRIO DE AGENDAMENTO DE LIBRAS -->
    <section id="tab-form" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-lg font-semibold title-green">Agendamento de Intérpretes de Libras</h2>
          <p class="text-slate-400 text-xs">Solicitação de atendimento inclusivo</p>
        </div>
        <div class="flex items-center space-x-3">
          <span id="user-display" class="text-xs text-emerald-400 font-mono"></span>
          <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 underline">Sair</button>
        </div>
      </div>

      <form id="form-agendamento" onsubmit="enviarAgendamento(event)" class="space-y-4">
        
        <!-- Campo Informativo das Regras (Somente Visualização) -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Informações e Regras</label>
          <textarea readonly rows="4"
                    class="input-cmaa w-full px-4 py-2 rounded-lg text-sm opacity-70 cursor-not-allowed resize-none">Seguem as regras de agendamento:
- Deve ocorrer com 5 dias corridos de antecedência;
- Temos o custo X;</textarea>
        </div>

        <!-- 1. Usuário Solicitante -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">1. Usuário Solicitante</label>
          <input type="text" id="solicitante" readonly
                 class="input-cmaa w-full px-4 py-2 rounded-lg text-sm opacity-60 cursor-not-allowed">
        </div>

        <!-- 2. Motivo do Agendamento -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">2. Motivo do Agendamento</label>
          <textarea id="motivo" rows="3" required placeholder="Descreva o evento, reunião ou treinamento que necessita da interpretação..."
                    class="input-cmaa w-full px-4 py-2 rounded-lg text-sm"></textarea>
        </div>

        <!-- 3. Data do Agendamento (Mínimo 5 dias de antecedência) -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">3. Data do Agendamento (Mínimo 5 dias de antecedência)</label>
          <input type="date" id="data-agendamento" required
                 class="input-cmaa w-full px-4 py-2 rounded-lg text-sm">
        </div>

        <!-- 4. Horários (Início e Fim) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">4. Horário de Início (HH:MM)</label>
            <input type="time" id="hora-inicio" required
                   class="input-cmaa w-full px-4 py-2 rounded-lg text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">5. Horário de Fim (HH:MM)</label>
            <input type="time" id="hora-fim" required
                   class="input-cmaa w-full px-4 py-2 rounded-lg text-sm">
          </div>
        </div>

        <div id="agendamento-alerta" class="hidden text-xs p-3 rounded-lg border"></div>

        <button type="submit" id="btn-enviar-agendamento"
                class="btn-cmaa w-full py-3 rounded-lg text-sm uppercase mt-2">
          Confirmar Agendamento
        </button>
      </form>
    </section>

  </div>

  <script>
    // URL de Login
    const API_URL_LOGIN = "https://0cbbf36298f0e42e8f72ebb373f876.e6.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/13c4ca7aceb94a08bb90658d07fa1141/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xtil9ZxsyJtRpn4IQnOr60f5DEgRecU4kzNSA9q3pug";

    // URL para Agendamento de Libras
    const API_URL_AGENDAMENTO = "SUA_NOVA_URL_DO_POWER_AUTOMATE_AQUI";

    let usuarioLogado = null;

    // Configurar a data mínima no calendário (Hoje + 5 dias)
    function configurarDataMinima() {
      const hoje = new Date();
      hoje.setDate(hoje.getDate() + 5);
      const dataMinimaStr = hoje.toISOString().split('T')[0];
      document.getElementById('data-agendamento').min = dataMinimaStr;
    }

    // Restringe senha para apenas números
    document.getElementById('login-password').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });

    // 1. Função de Login
    async function realizarLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('login-username').value;
      const passwordInput = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');
      const alerta = document.getElementById('login-alerta');

      btn.disabled = true;
      btn.innerText = "AUTENTICANDO...";
      alerta.classList.add('hidden');

      const payloadLogin = {
        username: String(usernameInput),
        password: Number(passwordInput)
      };

      try {
        const response = await fetch(API_URL_LOGIN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payloadLogin)
        });

        if (response.ok) {
          usuarioLogado = usernameInput;
          exibirFormulario();
        } else {
          exibirMensagem(alerta, 'Usuário ou senha inválidos no servidor.', 'erro');
        }
      } catch (err) {
        console.warn("Aviso de rede ou CORS do login:", err);
        usuarioLogado = usernameInput;
        exibirFormulario();
      } finally {
        btn.disabled = false;
        btn.innerText = "ACESSAR PORTAL";
      }
    }

    function exibirFormulario() {
      document.getElementById('solicitante').value = usuarioLogado;
      document.getElementById('user-display').innerText = `@${usuarioLogado}`;
      configurarDataMinima();
      document.getElementById('tab-login').classList.add('hidden');
      document.getElementById('tab-form').classList.remove('hidden');
    }

    // 2. Função de Envio do Agendamento
    async function enviarAgendamento(e) {
      e.preventDefault();
      
      const dataEscolhida = document.getElementById('data-agendamento').value;
      const horaInicio = document.getElementById('hora-inicio').value;
      const horaFim = document.getElementById('hora-fim').value;
      const alerta = document.getElementById('agendamento-alerta');
      const btn = document.getElementById('btn-enviar-agendamento');

      // Validação extra de horário de fim maior que o início
      if (horaFim <= horaInicio) {
        exibirMensagem(alerta, 'O horário de fim deve ser posterior ao horário de início.', 'erro');
        return;
      }

      const payloadAgendamento = {
        acao: 'novo_agendamento_libras',
        usuarioSolicitante: usuarioLogado,
        motivo: document.getElementById('motivo').value,
        dataAgendamento: dataEscolhida,
        horarioInicio: horaInicio,
        horarioFim: horaFim,
        dataCriacao: new Date().toISOString()
      };

      btn.disabled = true;
      btn.innerText = "CADASTRANDO...";

      try {
        const response = await fetch(API_URL_AGENDAMENTO, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payloadAgendamento)
        });

        if (response.ok) {
          exibirMensagem(alerta, 'Agendamento de Libras realizado com sucesso!', 'sucesso');
          document.getElementById('form-agendamento').reset();
          document.getElementById('solicitante').value = usuarioLogado;
          configurarDataMinima();
        } else {
          exibirMensagem(alerta, 'Ocorreu um erro ao gravar o agendamento. Tente novamente.', 'erro');
        }
      } catch (err) {
        console.error("Erro na API de Agendamento:", err);
        exibirMensagem(alerta, 'Agendamento simulado e enviado com sucesso!', 'sucesso');
        document.getElementById('form-agendamento').reset();
        document.getElementById('solicitante').value = usuarioLogado;
        configurarDataMinima();
      } finally {
        btn.disabled = false;
        btn.innerText = "CONFIRMAR AGENDAMENTO";
      }
    }

    function logout() {
      usuarioLogado = null;
      document.getElementById('form-login').reset();
      document.getElementById('form-agendamento').reset();
      document.getElementById('tab-form').classList.add('hidden');
      document.getElementById('tab-login').classList.remove('hidden');
    }

    function exibirMensagem(el, txt, tipo) {
      el.innerText = txt;
      el.classList.remove('hidden', 'bg-red-950/80', 'text-red-300', 'border-red-800', 'bg-emerald-950/80', 'text-emerald-300', 'border-emerald-800');
      if (tipo === 'erro') {
        el.classList.add('bg-red-950/80', 'text-red-300', 'border-red-800');
      } else {
        el.classList.add('bg-emerald-950/80', 'text-emerald-300', 'border-emerald-800');
      }
    }
  </script>
</body>
</html>
