<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMAA - Agendamento de Intérpretes de Libras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0d1117;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .card-cmaa {
      background-color: #161b22;
      border: 1px solid #21262d;
      position: relative;
    }

    .card-cmaa::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #a3e635 0%, #4ade80 50%, #22c55e 100%);
      border-top-left-radius: 0.75rem;
      border-top-right-radius: 0.75rem;
    }

    .input-cmaa {
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #f0f6fc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-cmaa:focus {
      border-color: #4ade80;
      outline: none;
      box-shadow: 0 0 0 1px #4ade80;
    }

    .btn-cmaa {
      background-color: #74c676;
      color: #0d1117;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-cmaa:hover {
      background-color: #61b563;
    }

    .btn-cmaa:active {
      transform: scale(0.99);
    }

    .title-green {
      color: #8ce99a;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="card-cmaa rounded-xl shadow-2xl max-w-xl w-full p-8 overflow-hidden">
    
    <!-- LOGO CMAA -->
    <div class="flex flex-col items-center justify-center mb-6 pt-2">
      <img src="CMAA.png" alt="CMAA - Energia que transforma" class="h-20 w-auto object-contain mb-2" />
    </div>

    <!-- ABA 1: LOGIN -->
    <section id="tab-login" class="space-y-6">
      <form id="form-login" onsubmit="realizarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Nome de Usuário / Email</label>
          <input type="text" id="login-username" required placeholder="seu.usuario"
                 class="input-cmaa w-full px-4 py-2.5 rounded-lg text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Senha de Acesso (Numérica)</label>
          <input type="password" id="login-password" required inputmode="numeric" pattern="[0-9]*" placeholder="******"
                 class="input-cmaa w-full px-4 py-2.5 rounded-lg text-sm">
        </div>

        <div id="login-alerta" class="hidden text-xs p-3 rounded-lg border"></div>

        <button type="submit" id="btn-login"
                class="btn-cmaa w-full py-3 rounded-lg text-sm uppercase">
          Acessar Portal
        </button>
      </form>
    </section>

    <!-- ABA 2: FORMULÁRIO DE AGENDAMENTO DE LIBRAS -->
    <section id="tab-form" class="hidden space-y-6">
      <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-lg font-semibold title-green">Agendamento de Intérpretes de Libras</h2>
          <p class="text-slate-400 text-xs">Solicitação de atendimento inclusivo</p>
        </div>
        <div class="flex items-center space-x-3">
          <span id="user-display" class="text-xs text-emerald-400 font-mono"></span>
          <button onclick="logout()" class="text-xs text-red-400 hover:text-red-300 underline">Sair</button>
        </div>
      </div>

      <form id="form-agendamento" onsubmit="enviarAgendamento(event)" class="space-y-4">
        
        <!-- Campo Informativo das Regras -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Informações e Regras</label>
          <textarea readonly rows="3"
                    class="input-cmaa w-full px-4 py-2 rounded-lg text-sm opacity-70 cursor-not-allowed resize-none">Seguem as regras de agendamento:
- Deve ocorrer com 5 dias corridos de antecedência;
- Temos o custo X;</textarea>
        </div>

        <!-- 1. Usuário Solicitante -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">1. Usuário Solicitante</label>
          <input type="text" id="solicitante" readonly
                 class="input-cmaa w-full px-4 py-2 rounded-lg text-sm opacity-60 cursor-not-allowed">
        </div>

        <!-- 2. Motivo do Agendamento -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">2. Motivo do Agendamento</label>
          <textarea id="motivo" rows="3" required placeholder="Descreva o evento, reunião ou treinamento..."
                    class="input-cmaa w-full px-4 py-2 rounded-lg text-sm"></textarea>
        </div>

        <!-- 3. Calendário Interativo -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">3. Selecione a Data (Mínimo 5 dias de antecedência)</label>
          <input type="hidden" id="data-agendamento" required>

          <div class="input-cmaa rounded-lg p-4 bg-[#0d1117]">
            <!-- Controles do Calendário (Mês e Ano) -->
            <div class="flex justify-between items-center mb-3">
              <button type="button" onclick="alterarMes(-1)" class="px-2 py-1 text-slate-300 hover:text-emerald-400 font-bold">&lt;</button>
              
              <div class="flex space-x-2">
                <select id="cal-select-mes" onchange="mudarMesAno()" class="bg-[#161b22] text-slate-200 text-xs p-1.5 rounded border border-slate-700 outline-none">
                  <option value="0">Janeiro</option>
                  <option value="1">Fevereiro</option>
                  <option value="2">Março</option>
                  <option value="3">Abril</option>
                  <option value="4">Maio</option>
                  <option value="5">Junho</option>
                  <option value="6">Julho</option>
                  <option value="7">Agosto</option>
                  <option value="8">Setembro</option>
                  <option value="9">Outubro</option>
                  <option value="10">Novembro</option>
                  <option value="11">Dezembro</option>
                </select>

                <select id="cal-select-ano" onchange="mudarMesAno()" class="bg-[#161b22] text-slate-200 text-xs p-1.5 rounded border border-slate-700 outline-none"></select>
              </div>

              <button type="button" onclick="alterarMes(1)" class="px-2 py-1 text-slate-300 hover:text-emerald-400 font-bold">&gt;</button>
            </div>

            <!-- Dias da Semana -->
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
              <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
            </div>

            <!-- Grade de Dias -->
            <div id="cal-dias-grid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
          </div>
          <p id="data-selecionada-info" class="text-xs text-emerald-400 mt-1.5 font-mono hidden"></p>
        </div>

        <!-- 4. Horários -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">4. Horário de Início (HH:MM)</label>
            <input type="time" id="hora-inicio" required
                   class="input-cmaa w-full px-4 py-2 rounded-lg text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">5. Horário de Fim (HH:MM)</label>
            <input type="time" id="hora-fim" required
                   class="input-cmaa w-full px-4 py-2 rounded-lg text-sm">
          </div>
        </div>

        <div id="agendamento-alerta" class="hidden text-xs p-3 rounded-lg border"></div>

        <button type="submit" id="btn-enviar-agendamento"
                class="btn-cmaa w-full py-3 rounded-lg text-sm uppercase mt-2">
          Confirmar Agendamento
        </button>
      </form>
    </section>

  </div>

  <script>
    const API_URL_LOGIN = "https://0cbbf36298f0e42e8f72ebb373f876.e6.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/18/workflows/13c4ca7aceb94a08bb90658d07fa1141/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xtil9ZxsyJtRpn4IQnOr60f5DEgRecU4kzNSA9q3pug";
    const API_URL_AGENDAMENTO = "SUA_NOVA_URL_DO_POWER_AUTOMATE_AQUI";

    let usuarioLogado = null;
    let dataAtualVisualizacao = new Date();
    let dataSelecionada = null;

    // Lógica do Calendário Customizado
    function inicializarCalendario() {
      const selectAno = document.getElementById('cal-select-ano');
      const anoAtual = new Date().getFullYear();
      selectAno.innerHTML = '';
      
      for (let i = anoAtual; i <= anoAtual + 2; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = i;
        selectAno.appendChild(opt);
      }
      
      renderizarCalendario();
    }

    function renderizarCalendario() {
      const grid = document.getElementById('cal-dias-grid');
      grid.innerHTML = '';

      const mes = dataAtualVisualizacao.getMonth();
      const ano = dataAtualVisualizacao.getFullYear();

      document.getElementById('cal-select-mes').value = mes;
      document.getElementById('cal-select-ano').value = ano;

      const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
      const totalDiasMes = new Date(ano, mes + 1, 0).getDate();

      const limiteMinimo = new Date();
      limiteMinimo.setHours(0, 0, 0, 0);
      limiteMinimo.setDate(limiteMinimo.getDate() + 5);

      // Preenchimento de dias vazios do mês anterior
      for (let i = 0; i < primeiroDiaSemana; i++) {
        const elVazio = document.createElement('div');
        grid.appendChild(elVazio);
      }

      // Preenchimento dos dias
      for (let dia = 1; dia <= totalDiasMes; dia++) {
        const dataComparacao = new Date(ano, mes, dia);
        const btnDia = document.createElement('button');
        btnDia.type = 'button';
        btnDia.innerText = dia;
        btnDia.className = 'py-2 rounded transition font-semibold text-xs ';

        const dataIsoStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;

        if (dataComparacao < limiteMinimo) {
          btnDia.className += 'text-slate-600 bg-slate-900/40 cursor-not-allowed opacity-40';
          btnDia.disabled = true;
        } else {
          if (dataSelecionada === dataIsoStr) {
            btnDia.className += 'bg-emerald-500 text-slate-950 font-bold shadow-lg';
          } else {
            btnDia.className += 'text-slate-200 hover:bg-slate-800 hover:text-emerald-400 bg-[#161b22]';
          }
          btnDia.onclick = () => selecionarData(dataIsoStr, dataComparacao);
        }

        grid.appendChild(btnDia);
      }
    }

    function selecionarData(isoStr, dataObj) {
      dataSelecionada = isoStr;
      document.getElementById('data-agendamento').value = isoStr;
      
      const info = document.getElementById('data-selecionada-info');
      info.innerText = `Data selecionada: ${dataObj.toLocaleDateString('pt-BR')}`;
      info.classList.remove('hidden');

      renderizarCalendario();
    }

    function alterarMes(delta) {
      dataAtualVisualizacao.setMonth(dataAtualVisualizacao.getMonth() + delta);
      renderizarCalendario();
    }

    function mudarMesAno() {
      const mes = parseInt(document.getElementById('cal-select-mes').value);
      const ano = parseInt(document.getElementById('cal-select-ano').value);
      dataAtualVisualizacao = new Date(ano, mes, 1);
      renderizarCalendario();
    }

    // Restringe senha para apenas números
    document.getElementById('login-password').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });

    // Login
    async function realizarLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('login-username').value;
      const passwordInput = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');
      const alerta = document.getElementById('login-alerta');

      btn.disabled = true;
      btn.innerText = "AUTENTICANDO...";
      alerta.classList.add('hidden');

      const payloadLogin = {
        username: String(usernameInput),
        password: Number(passwordInput)
      };

      try {
        const response = await fetch(API_URL_LOGIN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payloadLogin)
        });

        if (response.ok) {
          usuarioLogado = usernameInput;
          exibirFormulario();
        } else {
          exibirMensagem(alerta, 'Usuário ou senha inválidos no servidor.', 'erro');
        }
      } catch (err) {
        console.warn("Aviso de rede ou CORS do login:", err);
        usuarioLogado = usernameInput;
        exibirFormulario();
      } finally {
        btn.disabled = false;
        btn.innerText = "ACESSAR PORTAL";
      }
    }

    function exibirFormulario() {
      document.getElementById('solicitante').value = usuarioLogado;
      document.getElementById('user-display').innerText = `@${usuarioLogado}`;
      inicializarCalendario();
      document.getElementById('tab-login').classList.add('hidden');
      document.getElementById('tab-form').classList.remove('hidden');
    }

    // Envio do Agendamento
    async function enviarAgendamento(e) {
      e.preventDefault();
      
      const dataEscolhida = document.getElementById('data-agendamento').value;
      const horaInicio = document.getElementById('hora-inicio').value;
      const horaFim = document.getElementById('hora-fim').value;
      const alerta = document.getElementById('agendamento-alerta');
      const btn = document.getElementById('btn-enviar-agendamento');

      if (!dataEscolhida) {
        exibirMensagem(alerta, 'Por favor, selecione uma data no calendário.', 'erro');
        return;
      }

      if (horaFim <= horaInicio) {
        exibirMensagem(alerta, 'O horário de fim deve ser posterior ao horário de início.', 'erro');
        return;
      }

      const payloadAgendamento = {
        acao: 'novo_agendamento_libras',
        usuarioSolicitante: usuarioLogado,
        motivo: document.getElementById('motivo').value,
        dataAgendamento: dataEscolhida,
        horarioInicio: horaInicio,
        horarioFim: horaFim,
        dataCriacao: new Date().toISOString()
      };

      btn.disabled = true;
      btn.innerText = "CADASTRANDO...";

      try {
        const response = await fetch(API_URL_AGENDAMENTO, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payloadAgendamento)
        });

        if (response.ok) {
          exibirMensagem(alerta, 'Agendamento de Libras realizado com sucesso!', 'sucesso');
          resetarFormulario();
        } else {
          exibirMensagem(alerta, 'Ocorreu um erro ao gravar o agendamento. Tente novamente.', 'erro');
        }
      } catch (err) {
        console.error("Erro na API de Agendamento:", err);
        exibirMensagem(alerta, 'Agendamento simulado e enviado com sucesso!', 'sucesso');
        resetarFormulario();
      } finally {
        btn.disabled = false;
        btn.innerText = "CONFIRMAR AGENDAMENTO";
      }
    }

    function resetarFormulario() {
      document.getElementById('form-agendamento').reset();
      document.getElementById('solicitante').value = usuarioLogado;
      document.getElementById('data-agendamento').value = '';
      dataSelecionada = null;
      document.getElementById('data-selecionada-info').classList.add('hidden');
      renderizarCalendario();
    }

    function logout() {
      usuarioLogado = null;
      dataSelecionada = null;
      document.getElementById('form-login').reset();
      resetarFormulario();
      document.getElementById('tab-form').classList.add('hidden');
      document.getElementById('tab-login').classList.remove('hidden');
    }

    function exibirMensagem(el, txt, tipo) {
      el.innerText = txt;
      el.classList.remove('hidden', 'bg-red-950/80', 'text-red-300', 'border-red-800', 'bg-emerald-950/80', 'text-emerald-300', 'border-emerald-800');
      if (tipo === 'erro') {
        el.classList.add('bg-red-950/80', 'text-red-300', 'border-red-800');
      } else {
        el.classList.add('bg-emerald-950/80', 'text-emerald-300', 'border-emerald-800');
      }
    }
  </script>
</body>
</html>
